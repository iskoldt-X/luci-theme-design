# Round 44 Step 207 — conntrack byte/packet accounting
# Required by the bandwidth Hybrid Tier 2 architecture
# (doc/bandwith.md §2 + §8 Step 1).
#
# net.netfilter.nf_conntrack_acct is OFF by default in the kernel,
# even though CONFIG_NF_CONNTRACK_ACCT=y is compiled in. Per-namespace
# sysctl defaults to 0 to save CPU on routers that don't need
# accounting. The flag is only attached to NEW connections — flipping
# it mid-flight does NOT retroactively count existing flows.
#
# Without this sysctl set to 1 BEFORE WAN comes up, every architecture
# the Tier 2 daemon implements reads zero bytes regardless of how
# clever the parsing is.
#
# Memory record: [[netlink-conntrack-acct-sysctl-default-off]]
# References: https://lwn.net/Articles/616970/
#             Linux net/netfilter/nf_conntrack_acct.c

net.netfilter.nf_conntrack_acct = 1
