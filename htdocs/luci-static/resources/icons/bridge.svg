<?xml version="1.0" encoding="UTF-8"?>
<!--
  bridge.svg — Layer-2 network bridge (br-lan, docker0, …)
  Round 33 / Step 128 override for upstream LuCI icon
  Visual: two horizontal segments connected by vertical pillars
  Color hardcoded #10b981 (success) since <img> doesn't inherit CSS color
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
     fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="5" width="18" height="4" rx="0.75"/>
  <rect x="3" y="15" width="18" height="4" rx="0.75"/>
  <line x1="8" y1="9" x2="8" y2="15"/>
  <line x1="16" y1="9" x2="16" y2="15"/>
</svg>
