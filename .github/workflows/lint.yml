name: Lint

# Lightweight static checks on every push / PR.
# Catches things release.yml only sees at tag time.

on:
  push:
    branches: [ js, main, master ]
  pull_request:
  workflow_dispatch:

# Opt-in to Node 24 runtime for any straggler action that hasn't bumped
# (build.yml has the same env; the warning is workflow-scoped).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check JavaScript syntax
        run: |
          for f in $(find htdocs -name '*.js' -not -name 'jquery*.min.js'); do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate JSON files
        run: |
          for f in $(find htdocs -name '*.json'); do
            echo "Checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Shellcheck uci-defaults + CGI scripts + dev scripts
        # CGI scripts under /www/cgi-bin/design/ are user-reachable via the
        # LuCI auth-gated uhttpd. Any shell-injection bug here is potentially
        # remote code execution post-login — review carefully.
        # Step 69 (Round 12): also include devstats + nlbw (added Round 9)
        # and the Mac-side dev scripts (.sh extension auto-discovered by
        # scandir: '.', but listed here for completeness/audit visibility).
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          additional_files: >-
            root/etc/uci-defaults/30_luci-theme-design
            root/www/cgi-bin/design/ping
            root/www/cgi-bin/design/temp
            root/www/cgi-bin/design/devstats
            root/www/cgi-bin/design/download
            root/www/cgi-bin/design/upload
            root/www/cgi-bin/design/nlbw
          format: gcc
          severity: warning

      - name: CGI safety audit
        # See doc/upgrade.md §4.C5. We've shellchecked above; this step adds
        # theme-specific assertions about CGI inputs.
        run: |
          python3 <<'PY'
          import re, sys, os, glob
          fail = []

          cgi_files = glob.glob('root/www/cgi-bin/design/*')
          cgi_files = [f for f in cgi_files if os.path.isfile(f) and not f.endswith('.gitkeep')]

          for path in cgi_files:
              src = open(path).read()
              name = os.path.basename(path)

              # 1. Must start with shebang
              if not src.startswith('#!/bin/sh') and not src.startswith('#!/bin/bash'):
                  fail.append(f'{path}: missing #!/bin/sh shebang')

              # 2. Must NOT eval/exec/source untrusted input from $QUERY_STRING
              if re.search(r'(eval|exec|source|\.\s+)\s+["\']?\$\{?QUERY_STRING', src):
                  fail.append(f'{path}: dangerous use of $QUERY_STRING with eval/exec/source')

              # 3. download.cgi must clamp bytes (avoid OOM / abuse)
              if name == 'download':
                  if 'BYTES' not in src or '-gt' not in src:
                      fail.append(f'{path}: missing input bounds check on BYTES')

              # 4. Must emit Content-Type header
              if 'Content-Type:' not in src:
                  fail.append(f'{path}: missing Content-Type header')

              # 5. Cache-Control no-store (CGI responses change per request)
              if 'Cache-Control' not in src:
                  print(f'WARN {path}: no Cache-Control header (may be cached by uhttpd/browser)')

          if fail:
              print('FAIL — CGI safety audit issues:')
              for f in fail: print(f'  {f}')
              sys.exit(1)
          print(f'OK — {len(cgi_files)} CGI scripts pass theme safety audit')
          PY

      - name: Validate CSS brace balance
        run: |
          python3 <<'PY'
          import re, sys, glob
          ok = True
          for path in glob.glob('htdocs/**/*.css', recursive=True):
              content = open(path).read()
              no_comments = re.sub(r'/\*.*?\*/', '', content, flags=re.DOTALL)
              o, c = no_comments.count('{'), no_comments.count('}')
              if o != c:
                  print(f'FAIL {path}: {o} {{ vs {c} }}')
                  ok = False
              else:
                  print(f'OK   {path}: {o} pairs')
          sys.exit(0 if ok else 1)
          PY

      - name: Validate Lua template parses
        run: |
          # OpenWrt Lua templates aren't pure Lua, but we can at least check
          # there are no unbalanced template delimiters.
          python3 <<'PY'
          import re, sys, glob
          ok = True
          for path in glob.glob('luasrc/**/*.htm', recursive=True):
              content = open(path).read()
              opens = len(re.findall(r'<%', content))
              closes = len(re.findall(r'%>', content))
              if opens != closes:
                  print(f'FAIL {path}: {opens} <% vs {closes} %>')
                  ok = False
              else:
                  print(f'OK   {path}: {opens} template tags')
          sys.exit(0 if ok else 1)
          PY

      - name: Forbid raw CJK in source files
        # See doc/upgrade.md §0.6 — all user-visible strings must be wrapped
        # in _() (JS) or <%:%> (Lua templates) with English text. Raw CJK
        # characters in source files (outside comments) break LuCI's i18n
        # extraction pipeline, which uses English as the msgid key.
        run: |
          python3 <<'PY'
          import re, sys, glob
          fail = []
          patterns = [
              'htdocs/**/*.js',
              'htdocs/**/*.css',
              'luasrc/**/*.htm',
              'luasrc/**/*.lua',
              'root/www/cgi-bin/**/*',
          ]
          for path in sum((glob.glob(p, recursive=True) for p in patterns), []):
              try:
                  src = open(path).read()
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              # Strip comments first so doc-comments don't trigger.
              src = re.sub(r'//.*$', '', src, flags=re.M)              # JS //
              src = re.sub(r'/\*.*?\*/', '', src, flags=re.DOTALL)     # JS/CSS /* */
              src = re.sub(r'<!--.*?-->', '', src, flags=re.DOTALL)    # HTML
              src = re.sub(r'<%#.*?%>', '', src, flags=re.DOTALL)      # Lua template
              src = re.sub(r'(^|\s)#.*$', '', src, flags=re.M)         # shell / yaml
              for i, line in enumerate(src.split('\n'), 1):
                  if re.search(r'[\u4e00-\u9fff]', line):
                      fail.append(f'  {path}:{i}: {line.strip()[:80]}')
          if fail:
              print('FAIL — raw CJK found outside comments.')
              print('All user-visible strings must use _() or <%:%> with')
              print('English text; see doc/upgrade.md §0.6.\n')
              print('\n'.join(fail))
              sys.exit(1)
          print('OK — no raw CJK in source files')
          PY

      - name: Forbid misplaced @import in CSS
        # Step 69 (Round 12, 2026-05-23): CSS spec requires @import to
        # appear BEFORE all other style rules. Browsers silently ignore
        # @import that comes after rules — Edge/Chrome enforced this on
        # 2026-05-23 mid-development and broke our entire features.css
        # load (Round 11 Step 67 was the live-fire fix). Catch this at
        # PR time forever now: any @import that appears after the first
        # `{` in a CSS file fails the build.
        run: |
          python3 <<'PY'
          import re, sys, glob
          fail = []
          for path in glob.glob('htdocs/**/*.css', recursive=True):
              src = open(path).read()
              no_comments = re.sub(r'/\*.*?\*/', '', src, flags=re.DOTALL)
              first_brace = no_comments.find('{')
              if first_brace < 0:
                  continue
              for m in re.finditer(r'@import\b', no_comments):
                  if m.start() > first_brace:
                      # Approximate line number in stripped source
                      ln = no_comments[:m.start()].count('\n') + 1
                      fail.append(f'  {path}:{ln} (approx): @import at offset {m.start()} comes after first rule (`{{` at offset {first_brace})')
                      break  # one fail per file is enough
          if fail:
              print('FAIL — @import must appear before any style rule per CSS spec.')
              print('Move it into a <link rel=stylesheet> tag in header.htm instead.')
              print('See Step 67 / 69 in doc/styling-progress.md for the live-fire incident.\n')
              print('\n'.join(fail))
              sys.exit(1)
          print('OK — every @import sits before the first style rule')
          PY

      - name: Forbid minifier-unsafe CSS patterns
        # See doc/finalplan.md §10 — the ImmortalWrt 24.10 LuCI build pipeline
        # ships a broken CSS minifier that:
        #   (A) truncates modern CSS Color 4 `rgb(R G B / A%)` / `hsl(...)`
        #       space-separated syntax into `rgb(R}` (verified bug)
        #   (B) lowercases custom property *definitions* but not `var()`
        #       *references*, breaking case-sensitive --camelCase tokens
        # This step blocks both patterns at PR time so the regression that
        # killed v3's deploy (run 26312854285) can't sneak back in.
        run: |
          python3 <<'PY'
          import re, sys, glob
          fail_rgb = []
          fail_tokens = []
          for path in glob.glob('htdocs/**/*.css', recursive=True):
              src = open(path).read()
              # Bug A pattern: rgb(R G B / X%) or hsl(...) with space separator
              for i, line in enumerate(src.split('\n'), 1):
                  if re.search(r'(rgb|hsl)\(\s*[\d.]+\s+[\d.]+', line):
                      fail_rgb.append(f'  {path}:{i}: {line.strip()[:80]}')
              # Bug B pattern: --camelCase custom property names
              for prop in set(re.findall(r'--[a-zA-Z0-9_-]+', src)):
                  if any(c.isupper() for c in prop):
                      fail_tokens.append(f'  {path}: {prop}')

          if fail_rgb or fail_tokens:
              print('FAIL — CSS uses patterns the LuCI 24.10 minifier breaks.')
              print('See doc/finalplan.md §10 for full context.\n')
              if fail_rgb:
                  print('Modern CSS Color 4 syntax (use legacy rgba/hsla instead):')
                  print('\n'.join(fail_rgb))
                  print()
              if fail_tokens:
                  print('camelCase custom property names (use kebab-case lowercase):')
                  print('\n'.join(sorted(set(fail_tokens))))
              sys.exit(1)
          print('OK — CSS is minifier-safe (no modern rgb()/hsl() with space syntax, no camelCase tokens)')
          PY

      - name: Performance budget (asset sizes)
        # See doc/upgrade.md §6 "性能预算". Lighthouse CI would be the right
        # tool but requires a running LuCI instance. As a tractable proxy we
        # gzip-encode each asset class and verify the bundled size stays
        # under the documented v2 budget. PRs that explode binary cost fail
        # CI here instead of being noticed only at deploy time.
        run: |
          python3 <<'PY'
          import gzip, glob, os, sys

          BUDGETS = {
              # category : (max gzipped bytes, glob patterns)
              'css':   (35 * 1024, ['htdocs/luci-static/design/css/*.css']),
              'js':    (35 * 1024, ['htdocs/luci-static/design/js/*.js',
                                     'htdocs/luci-static/resources/*.js']),
              'fonts': (25 * 1024, ['htdocs/luci-static/design/fonts/*']),
              'sprite':(15 * 1024, ['htdocs/luci-static/design/icons.svg']),
              'cgi':   ( 5 * 1024, ['root/www/cgi-bin/design/*'])
          }

          fail = False
          for cat, (limit, patterns) in BUDGETS.items():
              total_raw = 0
              total_gz  = 0
              files = []
              for p in patterns:
                  for f in glob.glob(p):
                      if not os.path.isfile(f): continue
                      if f.endswith('.gitkeep'): continue
                      with open(f, 'rb') as fh: data = fh.read()
                      total_raw += len(data)
                      total_gz  += len(gzip.compress(data, compresslevel=9))
                      files.append(f)
              marker = '✅' if total_gz <= limit else '❌'
              print(f'{marker} {cat:6s} {len(files):2d} files  raw={total_raw:>7d}  gz={total_gz:>7d}  budget={limit:>7d}')
              if total_gz > limit:
                  fail = True
                  print(f'   OVER BUDGET by {total_gz - limit} bytes')

          if fail:
              print()
              print('Performance budget exceeded. See doc/upgrade.md §6.')
              sys.exit(1)
          PY
