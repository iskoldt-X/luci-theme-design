name: Lint

# Lightweight static checks on every push / PR.
# Catches things release.yml only sees at tag time.

on:
  push:
    branches: [ js, main, master ]
  pull_request:
  workflow_dispatch:

# Opt-in to Node 24 runtime for any straggler action that hasn't bumped
# (build.yml has the same env; the warning is workflow-scoped).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check JavaScript syntax
        run: |
          for f in $(find htdocs -name '*.js' -not -name 'jquery*.min.js'); do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Validate JSON files
        run: |
          for f in $(find htdocs -name '*.json'); do
            echo "Checking $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Shellcheck uci-defaults + rpcd ubus + dev scripts
        # Round 44 Step 201: cgi-bin/design/* removed; the 6 shell-side
        # endpoints all live in the rpcd ubus object now (Steps 163-167).
        # Shellcheck still applies to that script + uci-defaults + init.d.
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          additional_files: >-
            root/etc/uci-defaults/30_luci-theme-design-x
            root/usr/libexec/rpcd/luci-theme-design-x
          format: gcc
          severity: warning

      - name: rpcd ubus script safety audit
        # Round 44 Step 201: replaces the legacy "CGI safety audit". The
        # rpcd ubus dispatcher (root/usr/libexec/rpcd/luci-theme-design-x)
        # is now the only user-reachable shell entrypoint. It's auth-gated
        # by ACL (acl.d/luci-theme-design-x.json) but a shell-injection bug
        # here is still RCE post-auth — keep theme-specific asserts.
        run: |
          python3 <<'PY'
          import re, sys, os
          path = 'root/usr/libexec/rpcd/luci-theme-design-x'
          if not os.path.isfile(path):
              print(f'SKIP — {path} not present')
              sys.exit(0)
          src = open(path).read()
          fail = []
          # 1. Must start with shebang
          if not src.startswith('#!/bin/sh') and not src.startswith('#!/bin/bash'):
              fail.append('missing #!/bin/sh shebang')
          # 2. Must NOT eval/exec/source on raw stdin INPUT
          if re.search(r'(eval|exec|source|\.\s+)\s+["\']?\$\{?INPUT', src):
              fail.append('dangerous eval/exec/source of $INPUT')
          # 3. Device-name args (devstats / wifi-stations) must allowlist
          if 'devstats' in src and '[!A-Za-z0-9_-]' not in src:
              fail.append('devstats: missing device name allowlist')
          if fail:
              print('FAIL — rpcd safety audit:')
              for f in fail: print(f'  {f}')
              sys.exit(1)
          print(f'OK — rpcd ubus dispatcher passes safety audit')
          PY

      - name: Validate CSS brace balance
        run: |
          python3 <<'PY'
          import re, sys, glob
          ok = True
          for path in glob.glob('htdocs/**/*.css', recursive=True):
              content = open(path).read()
              no_comments = re.sub(r'/\*.*?\*/', '', content, flags=re.DOTALL)
              o, c = no_comments.count('{'), no_comments.count('}')
              if o != c:
                  print(f'FAIL {path}: {o} {{ vs {c} }}')
                  ok = False
              else:
                  print(f'OK   {path}: {o} pairs')
          sys.exit(0 if ok else 1)
          PY

      - name: Validate Lua template parses
        run: |
          # OpenWrt Lua templates aren't pure Lua, but we can at least check
          # there are no unbalanced template delimiters.
          python3 <<'PY'
          import re, sys, glob
          ok = True
          for path in glob.glob('luasrc/**/*.htm', recursive=True):
              content = open(path).read()
              opens = len(re.findall(r'<%', content))
              closes = len(re.findall(r'%>', content))
              if opens != closes:
                  print(f'FAIL {path}: {opens} <% vs {closes} %>')
                  ok = False
              else:
                  print(f'OK   {path}: {opens} template tags')
          sys.exit(0 if ok else 1)
          PY

      - name: Validate ucode template parses
        # Round 42 Step 162: parallel to the Lua check above. ucode template
        # syntax has three balanced delimiter pairs:
        #   {% ... %}   statement blocks
        #   {{ ... }}   expression substitutions
        #   {# ... #}   comments (silent, stripped before counting)
        # All three must be balanced (comments excluded from the count).
        # We don't try to parse the ucode body (that's the ucode runtime's
        # job) but unbalanced delimiters guarantee a 500 at render time,
        # so catch them at PR time.
        #
        # LuCI 24.10+ prefers .ut over .htm. The Lua check above and this
        # ucode check together cover both tracks of our dual-track templates
        # (Round 42 Step 161).
        run: |
          python3 <<'PY'
          import re, sys, glob
          ok = True
          paths = glob.glob('root/usr/share/ucode/**/*.ut', recursive=True)
          if not paths:
              print('No .ut files under root/usr/share/ucode/ — skipping')
              sys.exit(0)
          for path in paths:
              src = open(path).read()
              # Strip comments first so braces inside {# ... #} don't count.
              no_comments = re.sub(r'\{#.*?#\}', '', src, flags=re.DOTALL)
              block_open  = no_comments.count('{%')
              block_close = no_comments.count('%}')
              expr_open   = no_comments.count('{{')
              expr_close  = no_comments.count('}}')
              if block_open != block_close or expr_open != expr_close:
                  print(f'FAIL {path}:')
                  print(f'   {{% blocks: {block_open} open vs {block_close} close')
                  print(f'   {{{{ exprs:  {expr_open} open vs {expr_close} close')
                  ok = False
              else:
                  print(f'OK   {path}: {block_open} blocks, {expr_open} exprs')
          sys.exit(0 if ok else 1)
          PY

      - name: Forbid raw CJK in source files
        # See doc/upgrade.md §0.6 — all user-visible strings must be wrapped
        # in _() (JS) or <%:%> (Lua templates) with English text. Raw CJK
        # characters in source files (outside comments) break LuCI's i18n
        # extraction pipeline, which uses English as the msgid key.
        run: |
          python3 <<'PY'
          import re, sys, glob
          fail = []
          patterns = [
              'htdocs/**/*.js',
              'htdocs/**/*.css',
              'luasrc/**/*.htm',
              'luasrc/**/*.lua',
              'root/usr/libexec/rpcd/luci-theme-design-x',
          ]
          for path in sum((glob.glob(p, recursive=True) for p in patterns), []):
              try:
                  src = open(path).read()
              except (UnicodeDecodeError, IsADirectoryError):
                  continue
              # Strip comments first so doc-comments don't trigger.
              src = re.sub(r'//.*$', '', src, flags=re.M)              # JS //
              src = re.sub(r'/\*.*?\*/', '', src, flags=re.DOTALL)     # JS/CSS /* */
              src = re.sub(r'<!--.*?-->', '', src, flags=re.DOTALL)    # HTML
              src = re.sub(r'<%#.*?%>', '', src, flags=re.DOTALL)      # Lua template
              src = re.sub(r'(^|\s)#.*$', '', src, flags=re.M)         # shell / yaml
              for i, line in enumerate(src.split('\n'), 1):
                  if re.search(r'[\u4e00-\u9fff]', line):
                      fail.append(f'  {path}:{i}: {line.strip()[:80]}')
          if fail:
              print('FAIL — raw CJK found outside comments.')
              print('All user-visible strings must use _() or <%:%> with')
              print('English text; see doc/upgrade.md §0.6.\n')
              print('\n'.join(fail))
              sys.exit(1)
          print('OK — no raw CJK in source files')
          PY

      - name: Forbid misplaced @import in CSS
        # Step 69 (Round 12, 2026-05-23): CSS spec requires @import to
        # appear BEFORE all other style rules. Browsers silently ignore
        # @import that comes after rules — Edge/Chrome enforced this on
        # 2026-05-23 mid-development and broke our entire features.css
        # load (Round 11 Step 67 was the live-fire fix). Catch this at
        # PR time forever now: any @import that appears after the first
        # `{` in a CSS file fails the build.
        run: |
          python3 <<'PY'
          import re, sys, glob
          fail = []
          for path in glob.glob('htdocs/**/*.css', recursive=True):
              src = open(path).read()
              no_comments = re.sub(r'/\*.*?\*/', '', src, flags=re.DOTALL)
              first_brace = no_comments.find('{')
              if first_brace < 0:
                  continue
              for m in re.finditer(r'@import\b', no_comments):
                  if m.start() > first_brace:
                      # Approximate line number in stripped source
                      ln = no_comments[:m.start()].count('\n') + 1
                      fail.append(f'  {path}:{ln} (approx): @import at offset {m.start()} comes after first rule (`{{` at offset {first_brace})')
                      break  # one fail per file is enough
          if fail:
              print('FAIL — @import must appear before any style rule per CSS spec.')
              print('Move it into a <link rel=stylesheet> tag in header.htm instead.')
              print('See Step 67 / 69 in doc/styling-progress.md for the live-fire incident.\n')
              print('\n'.join(fail))
              sys.exit(1)
          print('OK — every @import sits before the first style rule')
          PY

      - name: Forbid minifier-unsafe CSS patterns
        # See doc/finalplan.md §10 — the ImmortalWrt 24.10 LuCI build pipeline
        # ships a broken CSS minifier that:
        #   (A) truncates modern CSS Color 4 `rgb(R G B / A%)` / `hsl(...)`
        #       space-separated syntax into `rgb(R}` (verified bug)
        #   (B) lowercases custom property *definitions* but not `var()`
        #       *references*, breaking case-sensitive --camelCase tokens
        # This step blocks both patterns at PR time so the regression that
        # killed v3's deploy (run 26312854285) can't sneak back in.
        run: |
          python3 <<'PY'
          import re, sys, glob
          fail_rgb = []
          fail_tokens = []
          for path in glob.glob('htdocs/**/*.css', recursive=True):
              src = open(path).read()
              # Bug A pattern: rgb(R G B / X%) or hsl(...) with space separator
              for i, line in enumerate(src.split('\n'), 1):
                  if re.search(r'(rgb|hsl)\(\s*[\d.]+\s+[\d.]+', line):
                      fail_rgb.append(f'  {path}:{i}: {line.strip()[:80]}')
              # Bug B pattern: --camelCase custom property names
              for prop in set(re.findall(r'--[a-zA-Z0-9_-]+', src)):
                  if any(c.isupper() for c in prop):
                      fail_tokens.append(f'  {path}: {prop}')

          if fail_rgb or fail_tokens:
              print('FAIL — CSS uses patterns the LuCI 24.10 minifier breaks.')
              print('See doc/finalplan.md §10 for full context.\n')
              if fail_rgb:
                  print('Modern CSS Color 4 syntax (use legacy rgba/hsla instead):')
                  print('\n'.join(fail_rgb))
                  print()
              if fail_tokens:
                  print('camelCase custom property names (use kebab-case lowercase):')
                  print('\n'.join(sorted(set(fail_tokens))))
              sys.exit(1)
          print('OK — CSS is minifier-safe (no modern rgb()/hsl() with space syntax, no camelCase tokens)')
          PY

      - name: Performance budget (asset sizes)
        # See doc/upgrade.md §6 "性能预算". Lighthouse CI would be the right
        # tool but requires a running LuCI instance. As a tractable proxy we
        # gzip-encode each asset class and verify the bundled size stays
        # under the documented budget. PRs that explode binary cost fail
        # CI here instead of being noticed only at deploy time.
        #
        # Step 244 (Round 48, 2026-06-10): budgets bumped to reflect actual
        # Round 12-48 growth. Added Batch 2-4 UX/A11y/Security features:
        # JS grew with global setInterval wrapper, devices list block/unblock
        # modals, focus traps, and state management. CSS grew with 
        # features.css and comprehensive dark mode token resolution + SVG masks.
        #
        # Justified increases:
        #   js     60 → 100 KB (currently ~90 KB)
        #   css    45 →  80 KB (currently ~68 KB)
        #
        # Headroom: ~10-15% per category. Bumping further requires explicit justification.
        run: |
          python3 <<'PY'
          import gzip, glob, os, sys

          BUDGETS = {
              # category : (max gzipped bytes, glob patterns)
              'css':   (80 * 1024, ['htdocs/luci-static/design-x/css/*.css']),
              'js':    (100 * 1024, ['htdocs/luci-static/design-x/js/*.js',
                                     'htdocs/luci-static/resources/design-x/*.js']),
              'fonts': (25 * 1024, ['htdocs/luci-static/design-x/fonts/*']),
              'sprite':(20 * 1024, ['htdocs/luci-static/design-x/icons.svg']),
              'rpcd':  ( 8 * 1024, ['root/usr/libexec/rpcd/luci-theme-design-x'])
          }

          fail = False
          for cat, (limit, patterns) in BUDGETS.items():
              total_raw = 0
              total_gz  = 0
              files = []
              for p in patterns:
                  for f in glob.glob(p):
                      if not os.path.isfile(f): continue
                      if f.endswith('.gitkeep'): continue
                      with open(f, 'rb') as fh: data = fh.read()
                      total_raw += len(data)
                      total_gz  += len(gzip.compress(data, compresslevel=9))
                      files.append(f)
              marker = '✅' if total_gz <= limit else '❌'
              print(f'{marker} {cat:6s} {len(files):2d} files  raw={total_raw:>7d}  gz={total_gz:>7d}  budget={limit:>7d}')
              if total_gz > limit:
                  fail = True
                  print(f'   OVER BUDGET by {total_gz - limit} bytes')

          if fail:
              print()
              print('Performance budget exceeded. See doc/upgrade.md §6.')
              sys.exit(1)
          PY

      - name: Check for luci-base path collisions
        # Round 42 Step 160 — defense against the bug class that broke MTK
        # build at Round 42 sub-A start. immortalwrt 24.10's luci-base
        # silently claimed /www/luci-static/resources/icons/*.svg paths
        # that our theme had been file-overriding since Round 32. opkg
        # refuses simultaneous file ownership; the MTK ipk pack aborted
        # with "file ... is already provided by package luci-base".
        # x86 happened to pass on an older luci-base snapshot — that's
        # luck, not safety.
        #
        # This job clones luci-base from THREE upstream branches we care
        # about (immortalwrt-24.10, openwrt-24.10, coolsnowwolf lean-23.05)
        # and asserts that none of OUR shipped paths overlap with any file
        # under each upstream's htdocs/ or root/ (those install to
        # /www/ and / respectively at ipk pack time).
        #
        # If this job ever fails: either upstream luci-base started
        # shipping a file at a path we own (move our copy into design-x/
        # via CSS substitution like Step 157 did for the 9 icon SVGs),
        # or we accidentally placed something under luci-base's namespace
        # (move it under design-x/ or resources/design-x/).
        run: |
          set -e
          mkdir -p /tmp/upstream-checks

          # OUR package's claimed install paths (htdocs → /www, root → /).
          # Trim any auto-generated files / .gitkeep / docs.
          our_paths=$(
              {
                  find htdocs -type f 2>/dev/null | sed 's|^htdocs|/www|'
                  find root -type f 2>/dev/null | sed 's|^root||'
              } | grep -v '/.gitkeep$' | sort -u
          )
          echo "OUR package claims $(echo "$our_paths" | wc -l | tr -d ' ') install paths"

          fail=0
          # Three upstream luci-base trees to diff against. Format per entry:
          # "<display-name> <github-org> <git-branch>". On any single fetch
          # failure, skip that upstream (warn, don't fail the pipeline —
          # network blips happen).
          for spec in \
              "immortalwrt-24.10 immortalwrt openwrt-24.10" \
              "openwrt-24.10 openwrt openwrt-24.10" \
              "lean-23.05 coolsnowwolf openwrt-23.05"
          do
              read -r name org branch <<< "$spec"
              echo
              echo "=== upstream: $name (github.com/$org/luci#$branch) ==="

              workdir=/tmp/upstream-checks/$name
              rm -rf "$workdir"
              if ! git clone --quiet --depth=1 --filter=blob:none --sparse \
                      "https://github.com/$org/luci.git" -b "$branch" "$workdir" 2>&1
              then
                  echo "  ⚠️  fetch failed for $org/luci#$branch — skipping"
                  continue
              fi
              git -C "$workdir" sparse-checkout set modules/luci-base 2>/dev/null || true

              if [ ! -d "$workdir/modules/luci-base" ]; then
                  echo "  ⚠️  no modules/luci-base in this tree — skipping"
                  continue
              fi

              upstream_paths=$(
                  cd "$workdir/modules/luci-base"
                  {
                      find htdocs -type f 2>/dev/null | sed 's|^htdocs|/www|'
                      find root   -type f 2>/dev/null | sed 's|^root||'
                  } | grep -v '/.gitkeep$' | sort -u
              )
              echo "  upstream claims $(echo "$upstream_paths" | wc -l | tr -d ' ') paths"

              collisions=$(comm -12 \
                  <(echo "$our_paths") \
                  <(echo "$upstream_paths"))

              if [ -n "$collisions" ]; then
                  n=$(echo "$collisions" | wc -l | tr -d ' ')
                  echo "  ❌ FAIL: $n path collision(s) with luci-base@$name:"
                  echo "$collisions" | sed 's/^/      /'
                  fail=1
              else
                  echo "  ✅ OK: no collisions"
              fi
          done

          if [ $fail -ne 0 ]; then
              echo
              echo "luci-base path collision detected. Round 42 / Step 157"
              echo "shows the rescue pattern: move the colliding file into"
              echo "htdocs/luci-static/design-x/<subdir>/, then add a CSS"
              echo "rule that uses content: url(...) to substitute upstream's"
              echo "served version at render time."
              exit 1
          fi
